# Profile "demo": dữ liệu mẫu để chạy thử và trình diễn. Bật bằng SPRING_PROFILES_ACTIVE=demo; ./mvnw spring-boot:run
# tự bật (thuộc tính spring-boot.run.profiles trong pom.xml). Giá trị ở đây đè lên application.properties.

# Ngoài schema còn chạy migration dữ liệu mẫu trong db/seed (V1_1__demo_data.sql...).
# DB đã nạp dữ liệu mẫu thì luôn chạy với profile này. Thiếu nó, Flyway thấy DB đã chạy 1.1 mà không có file:
# - chưa có migration schema nào mới hơn 1.1 → Flyway coi là "future" (DB mới hơn code) và bỏ qua;
# - đã có V2 trở lên → 1.1 thành "missing", app không khởi động ("Detected applied migration not resolved locally").
spring.flyway.locations=classpath:db/migration,classpath:db/seed
# Seed ghi ${image-base-url} thay cho địa chỉ ảnh, Flyway thay bằng giá trị này lúc chạy.
spring.flyway.placeholders.image-base-url=${app.upload.public-url}

# File ảnh của dữ liệu mẫu nằm sẵn trong jar. WebConfig tìm ảnh ở thư mục upload trước, không thấy thì tìm ở đây.
app.upload.seed-images-location=classpath:/seed/images/
