# Nạp BE/.env nếu có — chứa giá trị bí mật dạng KEY=value, không commit (mẫu ở BE/.env.example).
# Đường dẫn tính từ thư mục chạy app; biến môi trường thật được ưu tiên hơn file này.
spring.config.import=optional:file:.env[.properties]
spring.application.name=shopee
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/shopee_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Ghi/đọc mọi giá trị thời gian theo UTC. Cột DATETIME của MySQL không lưu múi giờ,
# nếu không ép thì giờ sẽ theo múi giờ của máy chạy app và lệch khi đổi máy.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.jdbc.error=ERROR

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=900
jwt.refresh-expiration-seconds=604800
# Giờ chạy job xoá refresh token đã quá hạn: 3h sáng mỗi ngày (giờ Việt Nam).
# Cron của Spring có 6 ô: giây phút giờ ngày tháng thứ.
jwt.refresh-purge-cron=0 0 3 * * *


# Upload ảnh
# Áp cho MỌI endpoint nhận multipart. Spring Boot mặc định đã là 1MB,
# ghi ra đây để luật "ảnh tối đa 1MB" (API_SPEC §4.3) có một chỗ nhìn thấy được.
# Request để 2MB vì ngoài file còn boundary và header của từng phần.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
# Thư mục lưu ảnh, tính từ thư mục chạy app (chạy ./mvnw trong BE/ thì là BE/uploads).
app.upload.dir=uploads
# Tiền tố URL trả cho FE, có "/" ở cuối. Phải khớp mẫu "/images/**" trong WebConfig.
app.upload.public-url=http://localhost:8081/images/
