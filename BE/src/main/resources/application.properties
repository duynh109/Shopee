spring.application.name=ecommerce
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/shopee_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Ghi/đọc mọi giá trị thời gian theo UTC. Cột DATETIME của MySQL không lưu múi giờ,
# nếu không ép thì giờ sẽ theo múi giờ của máy chạy app và lệch khi đổi máy.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

