server {
    listen 80;
    root /usr/share/nginx/html;

    # React Router xử lý đường dẫn ở trình duyệt: /cart, /user/purchase... không có file nào trên đĩa.
    # Không thấy file thì trả index.html để app tự hiện đúng trang; thiếu dòng này thì F5 ở /cart ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite gắn mã băm vào tên file trong assets/ (index-3f9a1c.js), nội dung đổi thì tên đổi,
    # nên trình duyệt được giữ chúng lâu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
