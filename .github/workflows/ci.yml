# Chạy mỗi lần push (mọi nhánh) và mỗi pull request vào main. Ba job:
# - backend:  build + test BE; test tích hợp chạy trên MySQL thật trong container (Testcontainers, runner có sẵn Docker)
# - frontend: lint (cảnh báo cũng tính là lỗi), test Vitest, build
# - e2e:      dựng cả hệ thống bằng docker compose như người dùng, rồi Playwright đi luồng mua hàng trên Chromium
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - name: Lưu báo cáo test khi hỏng
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: be-test-reports
          path: |
            BE/target/surefire-reports
            BE/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Chỉ chạy khi hai job kia xanh: build image tốn vài phút, vô ích nếu code đã hỏng ở test nhanh hơn.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tạo BE/.env với secret ngẫu nhiên (chỉ sống trong lần chạy này)
        run: |
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -base64 64 | tr -d '\n')" > BE/.env
      - name: Dựng cả hệ thống
        run: docker compose --env-file BE/.env up -d --build
      - name: Chờ BE sẵn sàng (Flyway dựng schema và nạp dữ liệu mẫu)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/api/products?limit=1 > /dev/null && exit 0
            sleep 3
          done
          docker compose --env-file BE/.env logs be
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Lưu báo cáo Playwright và log container khi hỏng
        if: failure()
        run: docker compose --env-file BE/.env logs > e2e/compose.log
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/compose.log
