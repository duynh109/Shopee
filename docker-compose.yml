# Chạy cả hệ thống bằng một lệnh:  docker compose --env-file BE/.env up --build
# Secret lấy từ BE/.env (chép từ BE/.env.example), dùng chung với lúc chạy BE bằng ./mvnw. Compose chỉ tự đọc .env ở
# thư mục gốc, nên phải chỉ file bằng --env-file; quên cờ đó thì compose dừng ngay và báo biến thiếu.
# Mở http://localhost:3000. Lần đầu app tự dựng schema và nạp dữ liệu mẫu (Flyway, profile demo).
name: shopee

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopee_db
      # App dùng user riêng chỉ có quyền trên shopee_db; mật khẩu root sinh ngẫu nhiên, không ai cần biết.
      MYSQL_USER: shopee
      MYSQL_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD — chép BE/.env.example thành BE/.env, chạy với --env-file BE/.env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    # Không mở cổng 3306 ra máy: chỉ BE cần nói chuyện với DB, và như vậy không đụng MySQL đang cài trên máy.
    healthcheck:
      # Ping qua TCP (-h 127.0.0.1), không qua socket: lúc khởi tạo MySQL chạy một server tạm chỉ nghe socket,
      # ping qua socket sẽ báo "khoẻ" trước khi DB thật sẵn sàng.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  be:
    build: ./BE
    environment:
      SPRING_PROFILES_ACTIVE: demo
      # Biến môi trường đè lên application.properties: "db" là tên service ở trên, Docker tự phân giải ra IP.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/shopee_db
      SPRING_DATASOURCE_USERNAME: shopee
      DB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD — chép BE/.env.example thành BE/.env, chạy với --env-file BE/.env}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET — chép BE/.env.example thành BE/.env, chạy với --env-file BE/.env}
    volumes:
      # Ảnh upload nằm ngoài container, nên tạo lại container (kể cả khi build image mới) vẫn còn ảnh.
      - uploads:/app/uploads
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  fe:
    build: ./FE
    ports:
      - "3000:80"
    depends_on:
      - be

volumes:
  db-data:
  uploads:
